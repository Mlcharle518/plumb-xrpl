# While this repository is PRIVATE, hosted runners are metered and the owner has no minutes left this month, so tests run
# locally (python -m pytest -q) and this workflow is manual. When the repo goes public (Actions are free there), restore:
#   on: { push: { branches: [main] }, pull_request: }
name: tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m plumb_xrpl --help
