# Publish to PyPI when a GitHub release is published. No token anywhere: PyPI trusts this workflow
# (trusted publishing, OIDC). PyPI side: project plumb-xrpl -> Publishing -> GitHub, owner Mlcharle518,
# repo plumb-xrpl, workflow release.yml, environment pypi.
name: release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest          # public repo: hosted runners, never the rig's self-hosted ones
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: python -m pip install build -e ".[test]"
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write                # the only credential: a short-lived OIDC token PyPI checks
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
