# Publish to PyPI when a GitHub release is published. No token anywhere: PyPI trusts this workflow
# (trusted publishing, OIDC). PyPI side: project plumb-xrpl -> Publishing -> GitHub, owner Mlcharle518,
# repo plumb-xrpl, workflow release.yml, environment pypi.
name: release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest          # public repo: hosted runners, never the rig's self-hosted ones
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: python -m pip install build -e ".[test]"
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write                # the only credential: a short-lived OIDC token PyPI checks
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
